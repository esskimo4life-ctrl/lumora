name: Build Lumora and Aetheria

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build existing project
        run: gradle build --no-daemon --stacktrace
      - name: Collect existing jar
        run: |
          mkdir -p dist
          cp build/libs/lumora-*.jar dist/
          rm -f dist/*-sources.jar
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Lumora-jar
          path: dist/lumora-*.jar
      - name: Build Aetheria Visuals from its standalone project
        run: gradle -p aetheria build --no-daemon --stacktrace
      - name: Package Aetheria jar and install guide
        run: |
          mkdir -p aetheria-release
          cp aetheria/build/libs/aetheria-visuals-1.0.0.jar aetheria-release/Aetheria-Visuals-26.1.2.jar
          cp aetheria/README.md aetheria-release/INSTALLATION.txt
          cd aetheria-release
          zip -9 Aetheria-Visuals-26.1.2.zip Aetheria-Visuals-26.1.2.jar INSTALLATION.txt
          ls -lh Aetheria-Visuals-26.1.2.zip Aetheria-Visuals-26.1.2.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Aetheria-Visuals-Package
          path: aetheria-release/Aetheria-Visuals-26.1.2.zip

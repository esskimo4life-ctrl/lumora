name: Build Aurea Visuals

on:
  push:
    branches:
      - aurea-visuals-26.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build mod and install ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Compile and test the project
        run: gradle --no-daemon clean build

      - name: Package JAR and readme
        run: |
          mkdir -p release
          cp build/libs/aurea-visuals-1.0.0.jar release/Aurea-Visuals-1.0.0+mc26.1.2.jar
          cp README.md release/README.txt
          cd release
          zip -j ../Aurea-Visuals-26.1.2.zip Aurea-Visuals-1.0.0+mc26.1.2.jar README.txt

      - name: Upload install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Aurea-Visuals-26.1.2
          path: Aurea-Visuals-26.1.2.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload plain JAR
        uses: actions/upload-artifact@v4
        with:
          name: Aurea-Visuals-JAR
          path: release/Aurea-Visuals-1.0.0+mc26.1.2.jar
          if-no-files-found: error
          retention-days: 30

name: Build AstraBoost
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build mod
        run: gradle build --no-daemon --stacktrace
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: AstraBoost-Minecraft-26.1.2
          path: build/libs/astraboost-*.jar
          if-no-files-found: error
          retention-days: 30

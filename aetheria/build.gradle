plugins { id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'; id 'maven-publish' }
version = '1.0.0'
group = 'dev.aetheria'
base { archivesName = 'aetheria-visuals' }
repositories { mavenCentral() }
dependencies { minecraft 'com.mojang:minecraft:26.1.2'; implementation 'net.fabricmc:fabric-loader:0.19.3'; implementation 'net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2' }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
